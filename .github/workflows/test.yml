---
name: test

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    env:
      # No Presidio here: the text tests skip themselves
      # (the full suite runs in test-full.yml).
      PIIGATE_PRESIDIO_URL: http://127.0.0.1:1
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # v7.0.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python-version }}
      # v10.3.0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          enable-cache: false
      - name: System packages (ripgrep, poppler) from the README requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ripgrep poppler-utils
      - name: Test dependencies (hypothesis, ruff), pinned by hash
        run: pip install --require-hashes -r tests/requirements.txt
      - name: Library, hooks and gate (without Presidio)
        run: python3 -I tests/test_filter.py
      - name: Property tests (Hypothesis)
        run: python3 -I tests/test_properties.py
      - name: MCP server
        run: uv run --quiet --script tests/test_mcp.py
      - name: Lint
        run: ruff check .
      - name: Manifests and config are valid JSON
        run: |
          for f in .claude-plugin/*.json hooks/hooks.json .mcp.json config.json; do
            python3 -m json.tool "$f" > /dev/null
          done
